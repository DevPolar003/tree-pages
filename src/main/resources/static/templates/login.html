<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta content="width=device-width, initial-scale=1" name="viewport">
    <title>TreePages</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="/css/style.css" rel="stylesheet">
</head>

<body>
<!--container-fluid = takes the entire width of the screen
      min-vh-100      = minimum height is 100% of the viewport-->
<div class="container-fluid min-vh-100">
    <div class="row justify-content-center align-items-center min-vh-100">
        <div class="col-10 col-sm-8 col-md-6 col-lg-4 d-flex flex-column">

            <h1 class="text-center mb-5"> Welcome back to <span class="title_welcome"> TreePages!</span></h1>

            <form action="/auth/login" class="d-flex justify-content-center align-items-center flex-column "
                  method="POST">
                <input class="inputs mb-5" id="email" placeholder="email" required type="email">
                <input class="inputs mb-5" id="password" placeholder=" password" required type="password">
                <button class="buttons_welcome mb-3" type="submit">Dive in!</button>
                <a class="buttons_welcome mb-5 d-flex align-items-center justify-content-center"
                   href="/templates/welcome.html">Back</a>
                <a href="/templates/forget_password.html"> I forgot my password</a>
            </form>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js">
</script>
<script src="/js/script.js"></script>

</body>

</html>
