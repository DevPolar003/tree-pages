<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta content="width=device-width, initial-scale=1" name="viewport">
    <title>Sing up</title>
    <link crossorigin="anonymous" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
          integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" rel="stylesheet">
    <link href="/css/style.css" rel="stylesheet">
</head>
<body>
<div class="container-fluid min-vh-100">
    <div class="row min-vh-100 justify-content-center align-items-center">
        <div class="col-10 col-sm-8 col-md-6 col-lg-4 d-flex flex-column justify-content-center align-items-center">
            <form action="/auth/register" class="justify-content-center align-items-center d-flex flex-column" id="account-form"
                  method="POST">
                <h1 class="mt-5">Happy to see you <span class="title_welcome">New user!</span></h1>
                <div class="d-grid gap-4 mt-5 justify-content-center align-items-center flex-column d-flex">

                    <input class="inputs" name="name" placeholder="name" type="input" type="text">
                    <input class="inputs" name="email" placeholder="email" required type="text" type="email">
                    <input class="inputs" name="password" placeholder="password" type="password" type="password">
                    <input class="buttons_welcome " id="submit" type="submit" value="submit">
                    <a class="text-center buttons_welcome  d-flex align-items-center justify-content-center"
                       href="/templates/welcome.html">voltar</a>
                </div>
            </form>
        </div>
    </div>
</div>
<script crossorigin="anonymous"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
<script src="/js/script.js"></script>
</body>
</html>
